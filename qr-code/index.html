<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Générateur de QR code &mdash; Outils</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css?v=1" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Outils</a>
      <span class="navbar-text text-light-emphasis">Générateur de QR code</span>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <h1 class="mb-4">Générateur de QR code</h1>

        <form id="qr-form" class="row g-3" novalidate>
          <div class="col-12">
            <label for="qr-text" class="form-label">Texte ou URL</label>
            <textarea class="form-control" id="qr-text" rows="3" placeholder="https://exemple.fr" required></textarea>
          </div>
          <div class="col-sm-6">
            <label for="error-level" class="form-label">Correction d'erreur</label>
            <select class="form-select" id="error-level">
              <option value="L">Basse (L) &mdash; capacité max.</option>
              <option value="M" selected>Moyenne (M)</option>
              <option value="Q">Élevée (Q)</option>
              <option value="H">Maximale (H) &mdash; résiste aux dégâts</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label for="cell-size" class="form-label">Taille</label>
            <select class="form-select" id="cell-size">
              <option value="4">Petite</option>
              <option value="6" selected>Moyenne</option>
              <option value="10">Grande</option>
            </select>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Générer</button>
          </div>
        </form>

        <div id="error-message" class="alert alert-danger mt-4 d-none"></div>

        <div id="result" class="text-center mt-4 d-none">
          <div class="result-box p-4 d-inline-block">
            <img id="qr-image" alt="QR code généré" class="img-fluid">
          </div>
          <div class="mt-3">
            <a id="download-link" class="btn btn-outline-secondary" download="qrcode.png">Télécharger en PNG</a>
          </div>
        </div>

        <p class="text-body-secondary small mt-4">
          Génération 100 % côté client (aucune donnée envoyée à un serveur). Un niveau de correction d'erreur
          plus élevé rend le code plus gros mais plus résistant si l'image est abîmée ou partiellement masquée.
        </p>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-light-emphasis py-3 mt-auto">
    <div class="container text-center small">
      &copy; <span id="year"></span> Outils
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="script.js?v=1"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
